name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Kids Mode and VideoCarousel
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout Onion (pinned)
        uses: actions/checkout@v4
        with:
          repository: OnionUI/Onion
          ref: 07505ea58c7bba698d6b9220ff43946a43cac76b
          path: onion
      - name: Build
        shell: bash
        run: |
          source /root/.bashrc
          cp -r src/kidsMode onion/src/
          cd onion/src/kidsMode
          make
          file kidui
          cp kidui "$GITHUB_WORKSPACE/App/KidsMode/bin/kidui"
          cd "$GITHUB_WORKSPACE"
          cp -r src/videoCarousel onion/src/
          cd onion/src/videoCarousel
          make
          file videoui libvcinput.so
          cp videoui libvcinput.so "$GITHUB_WORKSPACE/App/VideoCarousel/bin/"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMode-app
          path: App
          if-no-files-found: error

  release:
    name: Package release zip
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KidsMode-app
          path: App
      - name: Assemble zip
        run: |
          chmod +x App/KidsMode/bin/kidui App/KidsMode/*.sh
          chmod +x App/VideoCarousel/bin/videoui App/VideoCarousel/*.sh
          cp README.md App/KidsMode/
          cp docs/VIDEO-CAROUSEL-V1.md App/VideoCarousel/README.md
          cd App
          zip -r ../KidsMode.zip KidsMode
          zip -r ../VideoCarousel-V1.zip VideoCarousel
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Kids Mode ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            KidsMode.zip
            VideoCarousel-V1.zip
