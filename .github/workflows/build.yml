name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Super Kids Mode
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout Onion (pinned)
        uses: actions/checkout@v4
        with:
          repository: OnionUI/Onion
          ref: 07505ea58c7bba698d6b9220ff43946a43cac76b
          path: onion
      - name: Build
        shell: bash
        run: |
          source /root/.bashrc
          cp -r src/superKidsMode onion/src/
          cd onion/src/superKidsMode
          make
          file kidui libvcinput.so
          cp kidui libvcinput.so "$GITHUB_WORKSPACE/App/SuperKidsMode/bin/"
          chmod +x "$GITHUB_WORKSPACE/App/SuperKidsMode/bin/kidui" \
            "$GITHUB_WORKSPACE/App/SuperKidsMode/"*.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Kids-Mode-build
          path: App
          if-no-files-found: error

  release:
    name: Package release zip
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Super-Kids-Mode-build
          path: App
      - name: Assemble zip
        run: |
          chmod +x App/SuperKidsMode/bin/kidui App/SuperKidsMode/*.sh
          cp README.md App/SuperKidsMode/
          cd App
          zip -r ../Super-Kids-Mode.zip SuperKidsMode
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Super Kids Mode ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            Super-Kids-Mode.zip
