name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Kids Mode
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout Onion (pinned)
        uses: actions/checkout@v4
        with:
          repository: OnionUI/Onion
          ref: 07505ea58c7bba698d6b9220ff43946a43cac76b
          path: onion
      - name: Build
        shell: bash
        run: |
          source /root/.bashrc
          git -C onion apply "$GITHUB_WORKSPACE/patches/keymon-kids-sleep.patch"
          make -C onion/src/keymon \
            BUILD_DIR="$GITHUB_WORKSPACE/App/KidsMode/bin"
          cp -r src/kidsMode onion/src/
          cd onion/src/kidsMode
          make
          file kidui libvcinput.so "$GITHUB_WORKSPACE/App/KidsMode/bin/keymon"
          cp kidui libvcinput.so "$GITHUB_WORKSPACE/App/KidsMode/bin/"
          chmod +x "$GITHUB_WORKSPACE/App/KidsMode/bin/kidui" \
            "$GITHUB_WORKSPACE/App/KidsMode/bin/keymon" \
            "$GITHUB_WORKSPACE/App/KidsMode/"*.sh
      - name: Upload complete artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kids-Mode-build
          path: |
            App
            Media/KidsMode/Main
            Media/KidsMode/Guest
          if-no-files-found: error

  release:
    name: Package release zip
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kids-Mode-build
          path: .
      - name: Assemble zip
        run: |
          chmod +x App/KidsMode/bin/kidui App/KidsMode/bin/keymon \
            App/KidsMode/*.sh
          cp README.md App/KidsMode/
          zip -r Kids-Mode.zip App/KidsMode \
            Media/KidsMode/Main Media/KidsMode/Guest
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Kids Mode ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            Kids-Mode.zip
